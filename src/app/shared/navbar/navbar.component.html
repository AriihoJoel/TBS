<!--Navigation bar-->
    <header class="navbar" [class.scrolled]="isNavScrolled">
        <div class="navbar-inner">
                <a href="/">
                    <img src="/assets/Images/TBS_logo.png" class="logo" alt="TBS_logo">
                </a>
                <button type="button" class="nav-toggle" (click)="toggleMobileMenu()" [attr.aria-expanded]="isMobileMenuOpen" aria-label="Toggle navigation menu">
                  <i class="fa-solid" [class.fa-bars]="!isMobileMenuOpen" [class.fa-xmark]="isMobileMenuOpen"></i>  
                </button>
                <nav class="nav-links" [class.open]="isMobileMenuOpen">
                    <a href="/" (click)="closeMobileMenu()"><i class="fa-regular fa-house"></i>Home</a>
                    <a href="/#about-us" (click)="closeMobileMenu()"><i class="fa-regular fa-user"></i>About Us</a>
                    <a href="/#services" (click)="closeMobileMenu()"><i class="fa-regular fa-truck"></i>Services</a>
                    <a href="/#why-us" (click)="closeMobileMenu()"><i class="fa-solid fa-award"></i>Why Us</a>
                    <a href="/#clients" (click)="closeMobileMenu()"><i class="fa-regular fa-address-book"></i>Clients</a>
                    <a href="/#contact-us" (click)="closeMobileMenu()"><i class="fa-regular fa-comments"></i>Contact Us</a>
                    <a routerLink="/admin/inquiries" *ngIf="authService.isLoggedIn()" (click)="closeMobileMenu()" class="admin-link">
                        <i class="fa-solid fa-user-shield"></i>Inquiries
                    </a>
                </nav>
        </div>
    </header>
